{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>
        {% block title %}
            Telegram App
        {% endblock %}
    </title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            background: var(
                --tg-theme-bg-color,
                #ffffff
            );

            color: var(
                --tg-theme-text-color,
                #222222
            );

            padding-bottom: 70px;
        }


        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }


        .card {
            background: var(
                --tg-theme-secondary-bg-color,
                #f4f4f5
            );

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 15px;
        }


        .button {
            display: block;

            width: 100%;

            border: none;

            border-radius: 12px;

            padding: 14px;

            background: var(
                --tg-theme-button-color,
                #2481cc
            );

            color: var(
                --tg-theme-button-text-color,
                #ffffff
            );

            font-size: 16px;

            cursor: pointer;
        }


        .bottom-nav {

            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            height: 65px;

            display: flex;

            justify-content: space-around;
            align-items: center;

            background: var(
                --tg-theme-bg-color,
                #ffffff
            );

            border-top: 1px solid #ddd;

            z-index: 1000;
        }


        .nav-item {

            text-decoration: none;

            color: var(
                --tg-theme-hint-color,
                #777
            );

            font-size: 13px;

            text-align: center;
        }


        .nav-icon {
            font-size: 22px;
            display: block;
            margin-bottom: 3px;
        }


        .profile-header {
            text-align: center;
            padding: 20px 0;
        }


        .profile-image {

            width: 80px;
            height: 80px;

            border-radius: 50%;

            object-fit: cover;

            margin-bottom: 10px;
        }

        .input {
    width: 100%;

    padding: 13px;

    margin-top: 8px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 16px;

    background: var(
        --tg-theme-bg-color,
        #ffffff
    );

    color: var(
        --tg-theme-text-color,
        #222222
    );
}

/* =========================================================
   REPORTS PAGE
   ========================================================= */

.page-container {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;

    padding: 20px 16px 100px;
}


/* ---------------------------------------------------------
   PAGE HEADER
   --------------------------------------------------------- */

.page-header {
    margin-bottom: 22px;
}

.page-header h1 {
    margin: 0;

    font-size: 26px;
    font-weight: 700;

    color: var(--tg-text, #222);
}

.page-header p {
    margin: 5px 0 0;

    font-size: 14px;

    color: var(--tg-hint, #777);
}


/* ---------------------------------------------------------
   DATE FILTER
   --------------------------------------------------------- */

.report-filter {
    background: var(--tg-secondary, #ffffff);

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 20px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
}


.report-filter form {
    width: 100%;
}


.filter-row {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-bottom: 14px;
}


.filter-field {
    display: flex;

    flex-direction: column;

    gap: 6px;
}


.filter-field label {
    font-size: 12px;

    font-weight: 600;

    color: var(--tg-hint, #777);
}


.filter-field input {
    width: 100%;

    box-sizing: border-box;

    min-height: 42px;

    padding: 9px 10px;

    border: 1px solid rgba(0, 0, 0, 0.12);

    border-radius: 10px;

    background: var(--tg-bg, #f5f5f5);

    color: var(--tg-text, #222);

    font-size: 14px;

    outline: none;
}


.filter-field input:focus {
    border-color: var(--tg-button, #2481cc);
}


/* ---------------------------------------------------------
   PRIMARY BUTTON
   --------------------------------------------------------- */

.primary-button {
    width: 100%;

    min-height: 44px;

    border: none;

    border-radius: 11px;

    background: var(--tg-button, #2481cc);

    color: var(--tg-button-text, #ffffff);

    font-size: 15px;

    font-weight: 600;

    cursor: pointer;

    transition:
        transform 0.1s ease,
        opacity 0.1s ease;
}


.primary-button:active {
    transform: scale(0.98);

    opacity: 0.85;
}


/* ---------------------------------------------------------
   SUMMARY CARDS
   --------------------------------------------------------- */

.summary-grid {
    display: grid;

    grid-template-columns: 1fr;

    gap: 12px;

    margin-bottom: 20px;
}


.summary-card {
    background: var(--tg-secondary, #ffffff);

    border-radius: 16px;

    padding: 17px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);

    display: flex;

    flex-direction: column;

    gap: 7px;
}


.summary-label {
    font-size: 13px;

    color: var(--tg-hint, #777);
}


.summary-value {
    font-size: 23px;

    line-height: 1.2;

    font-weight: 700;

    color: var(--tg-text, #222);
}


/* ---------------------------------------------------------
   REPORT CARD
   --------------------------------------------------------- */

.report-card {
    background: var(--tg-secondary, #ffffff);

    border-radius: 16px;

    padding: 18px;

    margin-bottom: 18px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.06);
}


.report-card h2 {
    margin: 0 0 18px;

    font-size: 17px;

    font-weight: 650;

    color: var(--tg-text, #222);
}


/* ---------------------------------------------------------
   CHART
   --------------------------------------------------------- */

.chart-container {
    position: relative;

    width: 100%;

    height: 240px;
}


/* ---------------------------------------------------------
   CATEGORY LIST
   --------------------------------------------------------- */

.category-list {
    display: flex;

    flex-direction: column;

    gap: 2px;
}


.category-row {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 15px;

    padding: 13px 0;

    border-bottom: 1px solid rgba(0, 0, 0, 0.07);
}


.category-row:last-child {
    border-bottom: none;
}


.category-row > div {
    min-width: 0;
}


.category-row strong {
    display: block;

    font-size: 14px;

    color: var(--tg-text, #222);
}


.category-row small {
    display: block;

    margin-top: 3px;

    font-size: 11px;

    color: var(--tg-hint, #777);
}


.category-row > strong {
    white-space: nowrap;

    font-size: 14px;
}


/* ---------------------------------------------------------
   EMPTY STATE
   --------------------------------------------------------- */

.empty-state {
    text-align: center;

    padding: 30px 10px;

    font-size: 14px;

    color: var(--tg-hint, #777);
}


/* ---------------------------------------------------------
   TABLET / DESKTOP
   --------------------------------------------------------- */

@media (min-width: 600px) {

    .page-container {
        padding-left: 24px;

        padding-right: 24px;
    }


    .summary-grid {
        grid-template-columns:
            repeat(3, 1fr);
    }


    .report-filter form {
        display: flex;

        align-items: flex-end;

        gap: 12px;
    }


    .filter-row {
        flex: 1;

        margin-bottom: 0;
    }


    .primary-button {
        width: 120px;
    }

}

/* =========================================================
   QUICK REPORT FILTERS
   ========================================================= */

.quick-filters {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-bottom: 15px;
}


.quick-filter {
    min-height: 38px;

    padding: 8px 6px;

    display: flex;

    align-items: center;

    justify-content: center;

    border: 1px solid rgba(0, 0, 0, 0.08);

    border-radius: 10px;

    background: var(--tg-bg, #f5f5f5);

    color: var(--tg-text, #222);

    text-decoration: none;

    font-size: 12px;

    font-weight: 600;

    cursor: pointer;

    box-sizing: border-box;
}


.quick-filter.active {
    background: var(--tg-button, #2481cc);

    color: var(--tg-button-text, #ffffff);

    border-color:
        var(--tg-button, #2481cc);
}


.quick-filter:active {
    transform: scale(0.97);
}


/* ---------------------------------------------------------
   CUSTOM DATE FORM
   --------------------------------------------------------- */

.custom-date-form {
    display: none;
}


.custom-date-form.visible {
    display: block;
}


    </style>

</head>


<body>

    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    {% if user.is_authenticated %}

    <nav class="bottom-nav">

    <a
        href="{% url 'dashboard' %}"
        class="nav-item"
    >
        <span class="nav-icon">🏠</span>
        Home
    </a>
    


    <a
        href="{% url 'expenses' %}"
        class="nav-item"
    >
        <span class="nav-icon">📋</span>
        Expenses
    </a>

    <a
        href="{% url 'add_expense' %}"
        class="nav-item"
    >
        <span class="nav-icon">➕</span>
        Add
    </a>

     <a
        href="{% url 'reports' %}"
        class="nav-item {% if request.resolver_match.url_name == 'reports' %}active{% endif %}"
    >
        <span class="nav-icon">▥</span>
        <span class="nav-label">Reports</span>
    </a>


    


   

</nav>
    {% endif %}


   


    {% block javascript %}
    {% endblock %}

</body>

</html>
